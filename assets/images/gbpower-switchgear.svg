    <rect x="-58" y="28" width="116" height="30" rx="3" fill="#1a2d4a"/>
    <rect x="-52" y="33" width="30" height="20" rx="2" fill="#0a1a2a" stroke="#4a6a8a" stroke-width="1"/>
    <rect x="-16" y="33" width="30" height="20" rx="2" fill="#0a1a2a" stroke="#4a6a8a" stroke-width="1"/>
    <rect x="20" y="33" width="30" height="20" rx="2" fill="#0a1a2a" stroke="#4a6a8a" stroke-width="1"/>
    <rect x="-44" y="38" width="14" height="6" rx="1" fill="#00ff88"/>
    <rect x="-8" y="38" width="14" height="6" rx="1" fill="#ff9500"/>
    <rect x="28" y="38" width="14" height="6" rx="1" fill="#00ff88"/>
