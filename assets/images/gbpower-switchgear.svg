    <rect x="-30" y="88" width="60" height="10" rx="1" fill="#0a1a2a"/>
    <text x="0" y="96" font-family="Arial,sans-serif" font-size="6" font-weight="bold" fill="#3a6a9a" text-anchor="middle">SCHNEIDER CERTIFIED</text>
