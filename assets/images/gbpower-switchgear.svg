    <text x="-28" y="-69" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#00ff88" text-anchor="middle">6300A</text>
    <text x="-28" y="-62" font-family="Arial,sans-serif" font-size="5" fill="#00cc66" text-anchor="middle">CURRENT</text>
    <text x="28" y="-69" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#00ff88" text-anchor="middle">415V</text>
    <text x="28" y="-62" font-family="Arial,sans-serif" font-size="5" fill="#00cc66" text-anchor="middle">VOLTAGE</text>
