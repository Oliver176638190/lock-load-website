    <rect x="-58" y="-45" width="116" height="30" rx="3" fill="#1a2d4a"/>
    <rect x="-52" y="-40" width="30" height="20" rx="2" fill="#0a1a2a" stroke="#4a6a8a" stroke-width="1"/>
    <rect x="-16" y="-40" width="30" height="20" rx="2" fill="#0a1a2a" stroke="#4a6a8a" stroke-width="1"/>
    <rect x="20" y="-40" width="30" height="20" rx="2" fill="#0a1a2a" stroke="#4a6a8a" stroke-width="1"/>
    <!-- Switch handles -->
    <rect x="-44" y="-35" width="14" height="6" rx="1" fill="#ff9500"/>
    <rect x="-8" y="-35" width="14" height="6" rx="1" fill="#00ff88"/>
    <rect x="28" y="-35" width="14" height="6" rx="1" fill="#ff9500"/>
    <!-- Breaker Row 2 -->
    <rect x="-58" y="-8" width="116" height="30" rx="3" fill="#1a2d4a"/>
    <rect x="-52" y="-3" width="30" height="20" rx="2" fill="#0a1a2a" stroke="#4a6a8a" stroke-width="1"/>
    <rect x="-16" y="-3" width="30" height="20" rx="2" fill="#0a1a2a" stroke="#4a6a8a" stroke-width="1"/>
    <rect x="20" y="-3" width="30" height="20" rx="2" fill="#0a1a2a" stroke="#4a6a8a" stroke-width="1"/>
    <rect x="-44" y="2" width="14" height="6" rx="1" fill="#00ff88"/>
    <rect x="-8" y="2" width="14" height="6" rx="1" fill="#00ff88"/>
    <rect x="28" y="2" width="14" height="6" rx="1" fill="#3a6a9a" opacity="0.5"/>
