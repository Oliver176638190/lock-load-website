      <stop offset="0%" stop-color="#f5f8fc"/>
      <stop offset="100%" stop-color="#e8eef5"/>
    </linearGradient>
    <linearGradient id="panelG-SW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a6a9a"/>
      <stop offset="100%" stop-color="#1a3d6a"/>
    </linearGradient>
    <linearGradient id="doorG-SW" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a4a6a"/>
      <stop offset="100%" stop-color="#1a2d4a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgG-SW)"/>
  <ellipse cx="200" cy="245" rx="85" ry="6" fill="rgba(0,0,0,0.15)"/>
  <g transform="translate(200,130)">
    <!-- Main Panel Body -->
    <rect x="-75" y="-100" width="150" height="200" rx="6" fill="url(#panelG-SW)"/>
    <!-- Panel Door -->
    <rect x="-68" y="-93" width="136" height="186" rx="4" fill="url(#doorG-SW)"/>
    <!-- Top meter section -->
    <rect x="-58" y="-85" width="116" height="32" rx="3" fill="#0a1929"/>
    <rect x="-53" y="-80" width="50" height="22" rx="2" fill="#0d2818"/>
