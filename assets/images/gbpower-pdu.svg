<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgG-PDU" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f8fc"/>
      <stop offset="100%" stop-color="#e8eef5"/>
    </linearGradient>
    <linearGradient id="rackG-PDU" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a6a9a"/>
      <stop offset="100%" stop-color="#1a3d6a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgG-PDU)"/>
  <ellipse cx="200" cy="245" rx="75" ry="6" fill="rgba(0,0,0,0.15)"/>
  <g transform="translate(200,135)">
    <!-- Rack Body -->
    <rect x="-60" y="-105" width="120" height="195" rx="6" fill="url(#rackG-PDU)"/>
    <rect x="-54" y="-99" width="108" height="183" rx="4" fill="#1a2d4a"/>
    <!-- Top display -->
    <rect x="-44" y="-92" width="88" height="22" rx="3" fill="#0a1929"/>
    <rect x="-40" y="-88" width="80" height="14" rx="2" fill="#0d2818"/>
    <text x="0" y="-78" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#00ff88" text-anchor="middle">PDU · 400A · 3-PHASE</text>
    <!-- Rack-mount units -->
    <!-- Unit 1: Breaker bank -->
    <rect x="-44" y="-62" width="88" height="26" rx="2" fill="#0a1a2a" stroke="#3a5a7a" stroke-width="1"/>
    <rect x="-38" y="-57" width="16" height="16" rx="1" fill="#1a2d4a" stroke="#4a6a8a" stroke-width="0.5"/>
    <rect x="-18" y="-57" width="16" height="16" rx="1" fill="#1a2d4a" stroke="#4a6a8a" stroke-width="0.5"/>
    <rect x="2" y="-57" width="16" height="16" rx="1" fill="#1a2d4a" stroke="#4a6a8a" stroke-width="0.5"/>
    <rect x="22" y="-57" width="16" height="16" rx="1" fill="#1a2d4a" stroke="#4a6a8a" stroke-width="0.5"/>
    <!-- Breaker switches -->
    <rect x="-35" y="-53" width="10" height="4" rx="0.5" fill="#00ff88"/>
    <rect x="-15" y="-53" width="10" height="4" rx="0.5" fill="#00ff88"/>
    <rect x="5" y="-53" width="10" height="4" rx="0.5" fill="#ff9500"/>
    <rect x="25" y="-53" width="10" height="4" rx="0.5" fill="#00ff88"/>
    <!-- Unit 2: Outlet bank -->
    <rect x="-44" y="-30" width="88" height="30" rx="2" fill="#0a1a2a" stroke="#3a5a7a" stroke-width="1"/>
    <!-- IEC C13 outlets -->
    <rect x="-38" y="-25" width="14" height="10" rx="1" fill="#1a2d4a" stroke="#4a6a8a" stroke-width="0.5"/>
    <circle cx="-35" cy="-22" r="1.5" fill="#0a0a0a"/>
    <circle cx="-29" cy="-22" r="1.5" fill="#0a0a0a"/>
    <rect x="-20" y="-25" width="14" height="10" rx="1" fill="#1a2d4a" stroke="#4a6a8a" stroke-width="0.5"/>
    <circle cx="-17" cy="-22" r="1.5" fill="#0a0a0a"/>
    <circle cx="-11" cy="-22" r="1.5" fill="#0a0a0a"/>
    <rect x="-2" y="-25" width="14" height="10" rx="1" fill="#1a2d4a" stroke="#4a6a8a" stroke-width="0.5"/>
    <circle cx="1" cy="-22" r="1.5" fill="#0a0a0a"/>
    <circle cx="7" cy="-22" r="1.5" fill="#0a0a0a"/>
    <rect x="16" y="-25" width="14" height="10" rx="1" fill="#1a2d4a" stroke="#4a6a8a" stroke-width="0.5"/>
    <circle cx="19" cy="-22" r="1.5" fill="#0a0a0a"/>
    <circle cx="25" cy="-22" r="1.5" fill="#0a0a0a"/>
    <!-- Second row outlets -->
    <rect x="-38" y="-12" width="14" height="10" rx="1" fill="#1a2d4a" stroke="#4a6a8a" stroke-width="0.5"/>
    <rect x="-20" y="-12" width="14" height="10" rx="1" fill="#1a2d4a" stroke="#4a6a8a" stroke-width="0.5"/>
    <rect x="-2" y="-12" width="14" height="10" rx="1" fill="#1a2d4a" stroke="#4a6a8a" stroke-width="0.5"/>
    <rect x="16" y="-12" width="14" height="10" rx="1" fill="#1a2d4a" stroke="#4a6a8a" stroke-width="0.5"/>
    <!-- Unit 3: Metering -->
    <rect x="-44" y="6" width="88" height="28" rx="2" fill="#0a1a2a" stroke="#3a5a7a" stroke-width="1"/>
    <rect x="-38" y="10" width="36" height="20" rx="2" fill="#0d2818"/>
    <text x="-20" y="22" font-family="Arial,sans-serif" font-size="6" font-weight="bold" fill="#00ff88" text-anchor="middle">kWh</text>
    <text x="-20" y="28" font-family="Arial,sans-serif" font-size="5" fill="#00cc66" text-anchor="middle">128.5</text>
    <rect x="4" y="10" width="36" height="20" rx="2" fill="#0d2818"/>
    <text x="22" y="22" font-family="Arial,sans-serif" font-size="6" font-weight="bold" fill="#00ff88" text-anchor="middle">PWR</text>
    <text x="22" y="28" font-family="Arial,sans-serif" font-size="5" fill="#00cc66" text-anchor="middle">42.1kW</text>
    <!-- Unit 4: Network card -->
    <rect x="-44" y="40" width="88" height="20" rx="2" fill="#0a1a2a" stroke="#3a5a7a" stroke-width="1"/>
    <circle cx="-30" cy="50" r="3" fill="#00ff88"/>
    <circle cx="-20" cy="50" r="3" fill="#00ff88"/>
    <rect x="-8" y="46" width="20" height="8" rx="1" fill="#1a2d4a" stroke="#4a6a8a" stroke-width="0.5"/>
    <rect x="18" y="46" width="20" height="8" rx="1" fill="#1a2d4a" stroke="#4a6a8a" stroke-width="0.5"/>
    <!-- Handle -->
    <rect x="-3" y="66" width="6" height="16" rx="2" fill="#0a1a2a"/>
    <!-- Base -->
    <rect x="-65" y="85" width="130" height="8" fill="#1a1a1a"/>
  </g>
  <text x="200" y="265" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#1a3d6a" text-anchor="middle">GB POWER · POWER DISTRIBUTION UNIT</text>
  <text x="200" y="280" font-family="Arial,sans-serif" font-size="9" fill="#3a6a9a" text-anchor="middle">RACK-MOUNT · INTELLIGENT METERING</text>
</svg>