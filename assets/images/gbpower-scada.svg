<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgG-SC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f8fc"/>
      <stop offset="100%" stop-color="#e8eef5"/>
    </linearGradient>
    <linearGradient id="monG-SC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgG-SC)"/>
  <ellipse cx="200" cy="240" rx="100" ry="6" fill="rgba(0,0,0,0.15)"/>
  <g transform="translate(200,125)">
    <!-- Control Desk -->
    <rect x="-95" y="30" width="190" height="75" rx="4" fill="#3a6a9a"/>
    <rect x="-90" y="34" width="180" height="67" rx="3" fill="#1a3d6a"/>
    <!-- Desk front panels -->
    <rect x="-85" y="40" width="50" height="55" rx="2" fill="#1a2d4a" stroke="#2a4a6a" stroke-width="0.5"/>
    <rect x="-30" y="40" width="60" height="55" rx="2" fill="#1a2d4a" stroke="#2a4a6a" stroke-width="0.5"/>
    <rect x="35" y="40" width="50" height="55" rx="2" fill="#1a2d4a" stroke="#2a4a6a" stroke-width="0.5"/>
    <!-- Buttons -->
    <circle cx="-70" cy="52" r="5" fill="#00ff88"/>
    <circle cx="-55" cy="52" r="5" fill="#ff9500"/>
    <circle cx="-70" cy="68" r="5" fill="#cc2222"/>
    <circle cx="-55" cy="68" r="5" fill="#3a6a9a" opacity="0.5"/>
    <!-- Key switch -->
    <circle cx="-62" cy="84" r="5" fill="#0a1a2a" stroke="#4a6a8a" stroke-width="1"/>
    <circle cx="-62" cy="84" r="2" fill="#ff9500"/>
    <!-- Center joysticks -->
    <rect x="-18" y="48" width="14" height="14" rx="2" fill="#0a1a2a" stroke="#4a6a8a" stroke-width="1"/>
    <rect x="-14" y="42" width="6" height="10" rx="1" fill="#2a4a6a"/>
    <circle cx="-11" cy="42" r="4" fill="#3a6a9a"/>
    <rect x="4" y="48" width="14" height="14" rx="2" fill="#0a1a2a" stroke="#4a6a8a" stroke-width="1"/>
    <rect x="8" y="42" width="6" height="10" rx="1" fill="#2a4a6a"/>
    <circle cx="11" cy="42" r="4" fill="#3a6a9a"/>
    <!-- Center display -->
    <rect x="-22" y="68" width="44" height="16" rx="2" fill="#0a1929"/>
    <text x="0" y="79" font-family="Arial,sans-serif" font-size="6" font-weight="bold" fill="#00ff88" text-anchor="middle">SCADA ONLINE</text>
    <!-- Right panel indicators -->
    <circle cx="50" cy="50" r="4" fill="#00ff88"/>
    <text x="62" y="53" font-family="Arial,sans-serif" font-size="5" fill="#3a6a9a">RUN</text>
    <circle cx="50" cy="62" r="4" fill="#3a6a9a" opacity="0.5"/>
    <text x="62" y="65" font-family="Arial,sans-serif" font-size="5" fill="#3a6a9a">ALM</text>
    <circle cx="50" cy="74" r="4" fill="#ff9500" opacity="0.8"/>
    <text x="62" y="77" font-family="Arial,sans-serif" font-size="5" fill="#3a6a9a">WRN</text>
    <circle cx="50" cy="86" r="4" fill="#3a6a9a" opacity="0.5"/>
    <text x="62" y="89" font-family="Arial,sans-serif" font-size="5" fill="#3a6a9a">MNT</text>

    <!-- Monitor Screen -->
    <rect x="-80" y="-80" width="160" height="105" rx="5" fill="url(#monG-SC)"/>
    <rect x="-73" y="-73" width="146" height="91" rx="3" fill="#0d1e2e"/>
    <!-- Screen content: SCADA grid -->
    <line x1="-73" y1="-50" x2="73" y2="-50" stroke="#1a3d5a" stroke-width="0.5"/>
    <line x1="-73" y1="-28" x2="73" y2="-28" stroke="#1a3d5a" stroke-width="0.5"/>
    <line x1="-35" y1="-73" x2="-35" y2="18" stroke="#1a3d5a" stroke-width="0.5"/>
    <line x1="5" y1="-73" x2="5" y2="18" stroke="#1a3d5a" stroke-width="0.5"/>
    <line x1="40" y1="-73" x2="40" y2="18" stroke="#1a3d5a" stroke-width="0.5"/>
    <!-- Title bar -->
    <rect x="-73" y="-73" width="146" height="12" rx="1" fill="#1a3d6a"/>
    <text x="0" y="-64" font-family="Arial,sans-serif" font-size="6" font-weight="bold" fill="#00ff88" text-anchor="middle">GB POWER SCADA — POWER MONITORING</text>
    <!-- Block 1: Generator icon -->
    <rect x="-68" y="-57" width="28" height="22" rx="2" fill="#1a2d4a" stroke="#3a6a9a" stroke-width="0.8"/>
    <text x="-54" y="-46" font-family="Arial,sans-serif" font-size="5" fill="#00ff88" text-anchor="middle">GEN</text>
    <text x="-54" y="-40" font-family="Arial,sans-serif" font-size="4" fill="#00cc66" text-anchor="middle">ONLINE</text>
    <!-- Block 2: UPS icon -->
    <rect x="-30" y="-57" width="28" height="22" rx="2" fill="#1a2d4a" stroke="#3a6a9a" stroke-width="0.8"/>
    <text x="-16" y="-46" font-family="Arial,sans-serif" font-size="5" fill="#00ff88" text-anchor="middle">UPS</text>
    <text x="-16" y="-40" font-family="Arial,sans-serif" font-size="4" fill="#00cc66" text-anchor="middle">100%</text>
    <!-- Block 3: ATS -->
    <rect x="10" y="-57" width="28" height="22" rx="2" fill="#1a2d4a" stroke="#3a6a9a" stroke-width="0.8"/>
    <text x="24" y="-46" font-family="Arial,sans-serif" font-size="5" fill="#00ff88" text-anchor="middle">ATS</text>
    <text x="24" y="-40" font-family="Arial,sans-serif" font-size="4" fill="#00cc66" text-anchor="middle">MAINS</text>
    <!-- Block 4: PDU -->
    <rect x="44" y="-57" width="28" height="22" rx="2" fill="#1a2d4a" stroke="#3a6a9a" stroke-width="0.8"/>
    <text x="58" y="-46" font-family="Arial,sans-serif" font-size="5" fill="#ff9500" text-anchor="middle">PDU</text>
    <text x="58" y="-40" font-family="Arial,sans-serif" font-size="4" fill="#ff9500" text-anchor="middle">WARN</text>
    <!-- Connection lines -->
    <line x1="-40" y1="-46" x2="-30" y2="-46" stroke="#00ff88" stroke-width="1"/>
    <line x1="-2" y1="-46" x2="10" y2="-46" stroke="#00ff88" stroke-width="1"/>
    <line x1="38" y1="-46" x2="44" y2="-46" stroke="#ff9500" stroke-width="1"/>
    <!-- Chart area -->
    <rect x="-68" y="-25" width="136" height="38" rx="1" fill="#0a1a2a" opacity="0.6"/>
    <text x="-60" y="-18" font-family="Arial,sans-serif" font-size="4" fill="#3a6a9a">LOAD</text>
    <!-- Bar chart -->
    <rect x="-60" y="-5" width="8" height="14" fill="#00ff88"/>
    <rect x="-48" y="-8" width="8" height="17" fill="#00ff88"/>
    <rect x="-36" y="-3" width="8" height="12" fill="#00ff88"/>
    <rect x="-24" y="-10" width="8" height="19" fill="#ff9500"/>
    <rect x="-12" y="-6" width="8" height="15" fill="#00ff88"/>
    <rect x="0" y="-2" width="8" height="11" fill="#00ff88"/>
    <rect x="12" y="-7" width="8" height="16" fill="#00ff88"/>
    <rect x="24" y="-12" width="8" height="21" fill="#cc2222"/>
    <rect x="36" y="-4" width="8" height="13" fill="#00ff88"/>
    <rect x="48" y="-9" width="8" height="18" fill="#ff9500"/>
    <!-- Monitor stand -->
    <rect x="-6" y="25" width="12" height="8" fill="#1a1a1a"/>
    <rect x="-20" y="33" width="40" height="4" rx="1" fill="#1a1a1a"/>
  </g>
  <text x="200" y="265" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#1a3d6a" text-anchor="middle">GB POWER · SCADA CONTROL SYSTEM</text>
  <text x="200" y="280" font-family="Arial,sans-serif" font-size="9" fill="#3a6a9a" text-anchor="middle">PLC · BMS · REMOTE MONITORING</text>
</svg>