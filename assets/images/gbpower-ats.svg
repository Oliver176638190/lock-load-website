<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgG-ATS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f8fc"/>
      <stop offset="100%" stop-color="#e8eef5"/>
    </linearGradient>
    <linearGradient id="cabG-ATS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a6a9a"/>
      <stop offset="100%" stop-color="#1a3d6a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgG-ATS)"/>
  <ellipse cx="200" cy="235" rx="80" ry="6" fill="rgba(0,0,0,0.15)"/>
  <g transform="translate(200,130)">
    <!-- ATS Cabinet -->
    <rect x="-65" y="-90" width="130" height="170" rx="6" fill="url(#cabG-ATS)"/>
    <rect x="-59" y="-84" width="118" height="158" rx="4" fill="#1a2d4a"/>
    <!-- Display -->
    <rect x="-50" y="-76" width="100" height="28" rx="3" fill="#0a1929"/>
    <rect x="-45" y="-72" width="90" height="20" rx="2" fill="#0d2818"/>
    <text x="0" y="-62" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#00ff88" text-anchor="middle">ATS — AUTO MODE</text>
    <text x="0" y="-54" font-family="Arial,sans-serif" font-size="6" fill="#00cc66" text-anchor="middle">SRC: MAINS · 415V/50Hz</text>
    <!-- Status LEDs -->
    <circle cx="-38" cy="-38" r="5" fill="#00ff88"/>
    <text x="-38" y="-28" font-family="Arial,sans-serif" font-size="5" fill="#3a6a9a" text-anchor="middle">MAINS</text>
    <circle cx="-12" cy="-38" r="5" fill="#3a6a9a" opacity="0.4"/>
    <text x="-12" y="-28" font-family="Arial,sans-serif" font-size="5" fill="#3a6a9a" text-anchor="middle">GEN</text>
    <circle cx="14" cy="-38" r="5" fill="#3a6a9a" opacity="0.4"/>
    <text x="14" y="-28" font-family="Arial,sans-serif" font-size="5" fill="#3a6a9a" text-anchor="middle">TEST</text>
    <circle cx="38" cy="-38" r="5" fill="#ff9500" opacity="0.8"/>
    <text x="38" y="-28" font-family="Arial,sans-serif" font-size="5" fill="#3a6a9a" text-anchor="middle">FAULT</text>
    <!-- Transfer Switch Mechanism -->
    <rect x="-45" y="-15" width="90" height="50" rx="4" fill="#0a1a2a" stroke="#4a6a8a" stroke-width="1"/>
    <!-- Source 1 terminal -->
    <circle cx="-30" cy="-5" r="6" fill="#1a2d4a" stroke="#4a6a8a" stroke-width="1.5"/>
    <text x="-30" y="-3" font-family="Arial,sans-serif" font-size="5" fill="#3a6a9a" text-anchor="middle">S1</text>
    <!-- Source 2 terminal -->
    <circle cx="30" cy="-5" r="6" fill="#1a2d4a" stroke="#4a6a8a" stroke-width="1.5"/>
    <text x="30" y="-3" font-family="Arial,sans-serif" font-size="5" fill="#3a6a9a" text-anchor="middle">S2</text>
    <!-- Output terminal -->
    <circle cx="0" cy="25" r="7" fill="#1a2d4a" stroke="#ff9500" stroke-width="2"/>
    <text x="0" y="28" font-family="Arial,sans-serif" font-size="5" fill="#ff9500" text-anchor="middle">OUT</text>
    <!-- Switch arm (pointing to S1) -->
    <line x1="0" y1="25" x2="-30" y2="-5" stroke="#00ff88" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="25" x2="30" y2="-5" stroke="#3a6a9a" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4"/>
    <!-- Motor mechanism -->
    <rect x="-8" y="5" width="16" height="12" rx="2" fill="#1a3d6a"/>
    <circle cx="0" cy="11" r="3" fill="#0a1a2a" stroke="#4a6a8a" stroke-width="0.5"/>
    <!-- Mode selector -->
    <rect x="-45" y="42" width="90" height="16" rx="2" fill="#0a1929"/>
    <rect x="-40" y="46" width="24" height="8" rx="1" fill="#00ff88" opacity="0.3"/>
    <text x="-28" y="52" font-family="Arial,sans-serif" font-size="5" fill="#00ff88" text-anchor="middle">AUTO</text>
    <text x="-3" y="52" font-family="Arial,sans-serif" font-size="5" fill="#3a6a9a" text-anchor="middle">MAN</text>
    <text x="20" y="52" font-family="Arial,sans-serif" font-size="5" fill="#3a6a9a" text-anchor="middle">OFF</text>
    <!-- Handle -->
    <rect x="-3" y="62" width="6" height="16" rx="2" fill="#0a1a2a"/>
    <!-- Base -->
    <rect x="-70" y="80" width="140" height="8" fill="#1a1a1a"/>
  </g>
  <text x="200" y="265" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#1a3d6a" text-anchor="middle">GB POWER · AUTOMATIC TRANSFER SWITCH</text>
  <text x="200" y="280" font-family="Arial,sans-serif" font-size="9" fill="#3a6a9a" text-anchor="middle">ATS · 4-POLE · 100A – 6300A</text>
</svg>